[project]
name = "mlspace-plugin"
version = "1.0.1"
description = "Cloud.ru MLSpace plugin: MCP server, agent skills and setup"
keywords = ["mlspace", "mcp", "agent-skills", "cloudru"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # MCP 2.x removed the mcp.server.fastmcp import surface used by this server.
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
    "truststore>=0.10,<1",
    "prompt-toolkit>=3.0.48,<4",
    "tomli>=2; python_version < '3.11'",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.urls]
Repository = "https://github.com/cloud-ru/mlspace-plugin"
Issues = "https://github.com/cloud-ru/mlspace-plugin/issues"
Documentation = "https://github.com/cloud-ru/mlspace-plugin/blob/main/INSTALL.md"

[project.scripts]
mlspace-plugin = "mlspace_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6",
    "trustme>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlspace_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/.agents/plugins/marketplace.json", "/.claude-plugin", "/.codex-plugin",
    "/plugin.json", "/mcp.json", "/.mcp.json", "/uv.lock",
    "/src", "/tests", "/skills", "/scripts/gen_plugin.py", "/scripts/build_plugin.py",
    "/scripts/gen_body_schemas.py", "/scripts/demo_multi_workspace.py",
    "/scripts/mcp_call.py", "/scripts/serve_stdio.sh", "/scripts/serve_stdio_dryrun.sh",
    "/README.md", "/PLUGIN.md", "/INSTALL.md", "/INSTALL_AGENT.md", "/REFERENCE.md", "/AGENTS.md", "/CONTRIBUTING.md", "/RELEASE.md", "/LICENSE", "/pyproject.toml", "/.env.example",
]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "mlspace_mcp/skills"
"src/mlspace_mcp/spec/openapi.json" = "mlspace_mcp/spec/openapi.json"
"src/mlspace_mcp/spec/body_schemas.json" = "mlspace_mcp/spec/body_schemas.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
