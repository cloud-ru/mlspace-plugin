name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/gen_plugin.py --check
      - run: uv build
      - name: Bundle plugin
        run: uv run --locked python scripts/build_plugin.py
